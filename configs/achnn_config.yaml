experiment_name: abide_achnn_classification

paths:
  # Base directory where phenotypic CSV resides and results will be saved
  base_dir: /home/pl217/connecto-hopfield 
  # Path to the main phenotypic CSV file
  phenotypic_file: Phenotypic_V1_0b_preprocessed1.csv 
  # Directory containing the downloaded .1D timeseries files
  regional_timeseries_dir: /home/pl217/connecto-hopfield/results/abide_timeseries/ccs_filt_noglobal_rois_cc200
  # Base directory for saving experiment results
  results_base_dir: /home/pl217/connecto-hopfield/results 

# Quality Control - Site selection based on QC plots
qc:
  included_sites:
    - LEUVEN_1
    - LEUVEN_2
    - MAX_MUN
    - NYU
    - OHSU
    - PITT
    - SDSU
    - STANFORD
    - TRINITY
    - UCLA_1
    - UCLA_2
    - UM_1
    - UM_2
    - USM  # Keep with caution
    - YALE # Keep with caution
  # Motion QC thresholds (currently unused as we load all subjects from included sites)
  # max_fd: 0.5 
  # max_scrub: 20.0

data:
  num_regions: 200       # Changed to match CC200 atlas
  tr: 2.0                # IMPORTANT: Verify TR for ABIDE (varies by site!) - may need site-specific handling
  seq_len: 30            # Example window length (e.g., 60 seconds if TR=2s)
  window_step: 1         # Step for sliding window
  # Removed task-specific parameters like hrf_delay_secs, included_runs, conditions_to_classify

achnn_model:
  hidden_dim: 128
  num_classes: 2         # Binary classification: ASD vs TDC
  num_encoder_layers: 2  # Example: Number of Transformer layers
  num_self_attn_heads: 4 # Example: Heads for self-attention
  transformer_ff_dim: 512 # Example: Feedforward dim in Transformer
  embedding_dropout: 0.1
  encoder_dropout: 0.1
  classifier_dropout: 0.2
  use_positional_encoding: True
  query_selection_method: 'last' # How to get query for Hopfield ('last', 'mean', 'first')
  # Hopfield specific
  hopfield_num_heads: 1 # Often 1 for this type of layer
  hopfield_num_stored_patterns: 16 # Learnable patterns representing states
  hopfield_pattern_dim: 128        # Dimension of stored patterns (often = hidden_dim)
  hopfield_scaling: 1.0            # Beta parameter
  hopfield_update_steps: 1         # Typically 1 update step
  normalize_patterns: False        # Whether to normalize patterns in Hopfield space

training:
  seed: 42
  device: 'cuda'         # 'cuda' or 'cpu'
  batch_size: 64
  num_epochs: 100
  learning_rate: 0.0001
  weight_decay: 0.01
  cv_folds: 5            # Number of cross-validation folds
  patience: 15           # Early stopping patience
  num_workers: 16        # Number of worker processes for data loading
  pin_memory: true       # Pin memory for faster data transfer to GPU
  persistent_workers: true # Keep workers alive between iterations
  mixed_precision: true  # Use mixed precision training for faster computation
  prefetch_factor: 2     # Number of batches loaded in advance by each worker

analysis:
  plot_dpi: 150