experiment_name: abide_achnn_classification

paths:
  # Base directory where phenotypic CSV resides and results will be saved
  base_dir: /home/pl217/connecto-hopfield 
  # Path to the main phenotypic CSV file
  phenotypic_file: Phenotypic_V1_0b_preprocessed1.csv 
  # Directory containing the downloaded .1D timeseries files
  regional_timeseries_dir: /home/pl217/connecto-hopfield/results/abide_timeseries/ccs_filt_noglobal_rois_cc200
  # Base directory for saving experiment results
  results_base_dir: /home/pl217/connecto-hopfield/results 

# Quality Control - Site selection based on QC plots
qc:
  included_sites:
    #- LEUVEN_1
    #- LEUVEN_2
    #- MAX_MUN
    - NYU
    #- OHSU
    #- PITT
    - SDSU
    - STANFORD
    - TRINITY
    #- UCLA_1
    #- UCLA_2
    - UM_1
    - UM_2
    #- USM  # Keep with caution
    #- YALE # Keep with caution
  # Motion QC thresholds (currently unused as we load all subjects from included sites)
  # max_fd: 0.5 
  # max_scrub: 20.0

data:
  num_regions: 200       # Changed to match CC200 atlas
  tr: 2.0                # IMPORTANT: Verify TR for ABIDE (varies by site!) - may need site-specific handling
  seq_len: 30            # Example window length (e.g., 60 seconds if TR=2s)
  window_step: 1         # Step for sliding window
  # Removed task-specific parameters like hrf_delay_secs, included_runs, conditions_to_classify

achnn_model:
  hidden_dim: 64
  num_encoder_layers: 1
  num_heads: 2
  dropout: 0.3
  update_steps_max: 3
  scaling: 0.5
  use_positional_encoding: true
  return_attention: true
  normalize_patterns: true
  normalize_stored_patterns: true
  normalize_pattern_projection: true
  normalize_state: true
  num_classes: 2
  num_self_attn_heads: 2
  transformer_ff_dim: 128
  embedding_dropout: 0.2
  encoder_dropout: 0.2
  classifier_dropout: 0.3
  query_selection_method: 'mean'
  # Hopfield specific
  hopfield_num_heads: 1
  hopfield_num_stored_patterns: 8
  hopfield_pattern_dim: 32
  hopfield_scaling: 2.0
  hopfield_update_steps: 1

training:
  seed: 42
  device: cuda
  batch_size: 16
  num_epochs: 100
  
  # Revert to OneCycleLR settings
  scheduler_type: OneCycleLR
  learning_rate: 0.001             # Base learning rate (AdamW default will use this)
  max_lr: 0.003                    # Max LR for OneCycleLR
  weight_decay: 0.01
  
  # Early Stopping 
  early_stopping_patience: 10
  early_stopping_metric: accuracy 
  patience: 10 # Keep consistent

  gradient_clip: 1.0
  mixed_precision: false
  
  # DataLoader settings
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  cv_folds: 5

# Removed ReduceLROnPlateau specific parameters
# Removed scheduler_step_size (not needed for OneCycleLR with total_steps)
# Kept warmup_epochs implicitly via pct_start in OneCycleLR setup script

analysis:
  plot_dpi: 150