experiment_name: abide_achnn_classification

paths:
  # Base directory where phenotypic CSV resides and results will be saved
  base_dir: /home/pl217/connecto-hopfield 
  # Path to the main phenotypic CSV file
  phenotypic_file: Phenotypic_V1_0b_preprocessed1.csv 
  # Directory containing the downloaded .1D timeseries files
  regional_timeseries_dir: /home/pl217/connecto-hopfield/results/abide_timeseries/ccs_filt_noglobal_rois_cc200
  # Base directory for saving experiment results
  results_base_dir: /home/pl217/connecto-hopfield/results 

# Quality Control - Site selection based on QC plots
qc:
  included_sites:
    - LEUVEN_1
    - LEUVEN_2
    - MAX_MUN
    - NYU
    - OHSU
    - PITT
    - SDSU
    - STANFORD
    - TRINITY
    - UCLA_1
    - UCLA_2
    - UM_1
    - UM_2
    - USM  # Keep with caution
    - YALE # Keep with caution
  # Motion QC thresholds (currently unused as we load all subjects from included sites)
  # max_fd: 0.5 
  # max_scrub: 20.0

data:
  num_regions: 200       # Changed to match CC200 atlas
  tr: 2.0                # IMPORTANT: Verify TR for ABIDE (varies by site!) - may need site-specific handling
  seq_len: 30            # Example window length (e.g., 60 seconds if TR=2s)
  window_step: 1         # Step for sliding window
  # Removed task-specific parameters like hrf_delay_secs, included_runs, conditions_to_classify

achnn_model:
  hidden_dim: 128         # Restored original hidden dimension
  num_classes: 2         # Binary classification: ASD vs TDC
  num_encoder_layers: 2  # Increased layers for better feature extraction
  num_self_attn_heads: 8 # Increased from 2 to 8 heads
  transformer_ff_dim: 512 # Increased from 256 to 512
  embedding_dropout: 0.2  # Moderate dropout
  encoder_dropout: 0.2    # Moderate dropout
  classifier_dropout: 0.3 # Increased dropout for classifier
  use_positional_encoding: True
  query_selection_method: 'mean' # Changed from 'last' to 'mean' to capture full sequence information
  # Hopfield specific
  hopfield_num_heads: 2   # Increased from 1 to 2
  hopfield_num_stored_patterns: 16 # Increased from 4 to 16
  hopfield_pattern_dim: 128   # Match hidden_dim
  hopfield_scaling: 2.0       # Increased from 1.0 to 2.0
  hopfield_update_steps: 3    # Increased from 1 to 3 update steps
  normalize_patterns: True    # Keep True for better training

training:
  seed: 1024       # Changed seed value to break symmetry
  device: 'cuda'   # 'cuda' or 'cpu'
  batch_size: 16   # Keep smaller batch size
  num_epochs: 100  # Increased from 50 to 100
  learning_rate: 0.005  # Increased from 0.003 to 0.005
  weight_decay: 0.0001  # Increased from 0.00005 to 0.0001
  scheduler_step_size: 5
  scheduler_gamma: 0.8   # Less aggressive reduction
  early_stopping_patience: 15
  gradient_clip: 1.0     # Increased from 0.5 to 1.0
  mixed_precision: false # Keep disabled for stability
  cv_folds: 5
  patience: 20
  num_workers: 16
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2

analysis:
  plot_dpi: 150