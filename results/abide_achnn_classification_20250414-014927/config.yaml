achnn_model:
  classifier_dropout: 0.2
  embedding_dropout: 0.1
  encoder_dropout: 0.1
  hidden_dim: 128
  hopfield_num_heads: 1
  hopfield_num_stored_patterns: 16
  hopfield_pattern_dim: 128
  hopfield_scaling: 1.0
  hopfield_update_steps: 1
  normalize_patterns: false
  num_classes: 2
  num_encoder_layers: 2
  num_self_attn_heads: 4
  query_selection_method: last
  transformer_ff_dim: 512
  use_positional_encoding: true
analysis:
  plot_dpi: 150
data:
  num_regions: 200
  seq_len: 30
  tr: 2.0
  window_step: 1
experiment_name: abide_achnn_classification
paths:
  base_dir: /home/pl217/connecto-hopfield
  phenotypic_file: Phenotypic_V1_0b_preprocessed1.csv
  regional_timeseries_dir: /home/pl217/connecto-hopfield/results/abide_timeseries/ccs_filt_noglobal_rois_cc200
  results_base_dir: /home/pl217/connecto-hopfield/results
qc:
  included_sites:
  - LEUVEN_1
  - LEUVEN_2
  - MAX_MUN
  - NYU
  - OHSU
  - PITT
  - SDSU
  - STANFORD
  - TRINITY
  - UCLA_1
  - UCLA_2
  - UM_1
  - UM_2
  - USM
  - YALE
training:
  batch_size: 64
  cv_folds: 5
  device: cuda
  learning_rate: 0.0001
  mixed_precision: true
  num_epochs: 100
  num_workers: 16
  patience: 15
  persistent_workers: true
  pin_memory: true
  prefetch_factor: 2
  seed: 42
  weight_decay: 0.01
