# --- Configuration for Baseline (Static FC + SVM) ---
run_params:
  seed: 42
  n_splits: 10   # Number of folds for cross-validation

data_params:
  phenotype_file: 'Phenotypic_V1_0b_preprocessed1.csv' # Check filename
  # Directory containing SUBJECT-SPECIFIC timeseries files (e.g., SITE_SUBID_rois_cc200.1D)
  region_dir: '/home/pl217/connecto-hopfield/results/abide_timeseries/ccs_filt_noglobal_rois_cc200' # Check path
  # Directory to save processed features
  output_feature_dir: 'processed_features_baseline'
  num_regions: 200      # CC200 Atlas
  # Core phenotype features to include
  phenotype_cols_numerical: ['AGE_AT_SCAN', 'FIQ', 'func_mean_fd']
  phenotype_cols_categorical: ['SEX', 'SITE_ID', 'EYE_STATUS_AT_SCAN']
  target_col: 'DX_GROUP'
  sub_id_col: 'SUB_ID'
  site_id_col: 'SITE_ID' # Needed for finding TS files

feature_selection_params:
  use_rfe: True          # Use Recursive Feature Elimination?
  n_features_to_select: 1000 # Number of features to keep after RFE (tune this)

svm_params:
  C: 1.0                # SVM regularization parameter (tune this)
  gamma: 'scale'        # Kernel coefficient ('scale', 'auto', or float) (tune this)
  kernel: 'rbf'         # Kernel type ('rbf', 'linear', 'poly', 'sigmoid')